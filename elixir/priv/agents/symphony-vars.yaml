# Symphony project variables — replace {{xxx}} before first agent run.
# Generated by `symphony init`. Preserved on `--upgrade`.
project_name: "{{project_name}}"
language: "{{language}}"             # elixir | python | typescript | go | rust
base_branch: "{{base_branch}}"       # develop | main
test_command: "{{test_command}}"     # e.g. "cd elixir && mix test"
build_command: "{{build_command}}"   # e.g. "cd elixir && mix build"
pr_label: "{{pr_label}}"             # e.g. "symphony"
agent_kind: "{{agent_kind}}"         # cursor | claude
agent_command: "{{agent_command}}"   # e.g. "cursor --model auto"
linear_slug: "{{linear_slug}}"       # Linear project slug
linear_api_key_env: "LINEAR_API_KEY"
workspace_root: "{{workspace_root}}" # e.g. "~/code/symphony-workspaces"
